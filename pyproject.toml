[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browserpilot"
version = "0.1.0"
description = "Autonomous browser agent combining Chrome accessibility tree parsing with visual element labeling, stealth CDP patches, and human-in-the-loop takeover."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexandr Motologa", email = "alexandrmotologa@users.noreply.github.com" }
]
keywords = [
    "browser-automation",
    "ai-agent",
    "web-scraping",
    "autonomous-agent",
    "chrome-devtools-protocol",
    "accessibility-tree",
    "cdp",
    "human-in-the-loop",
    "anti-bot-bypass",
    "stealth-browser",
    "self-healing",
    "playwright",
    "fastapi",
    "react-19"
]
dependencies = [
    "playwright>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.20.0",
    "anthropic>=0.25.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pillow>=10.3.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
stealth = [
    "patchright>=1.40.0"
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
browserpilot = "browserpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
